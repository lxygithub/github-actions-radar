name: 每日 GitHub 副业雷达

on:
  schedule:
    # UTC 22:37 = 北京时间次日 06:37，选在 Actions 的低负载时段。
    # 依据：GitHub 官方说明整点是负载高峰、schedule 可能延迟数小时甚至被丢弃；
    # 社区对 2 万余条 cron 的统计显示 00:00-06:59 UTC 占 64% 日程、中位延迟 103 分钟，
    # 而 21:00-23:59 UTC 中位延迟仅 22-35 分钟。原 "17 1 * * *"（北京 09:17）
    # 实测每次都拖到 UTC 07:50-09:12（北京 15:50-17:12），故挪到 22:37。
    - cron: "37 22 * * *"
  workflow_dispatch:
  # push 代码后自动跑完整流程并发布，不用再手动点 Run workflow
  push:
    branches: [main]
    # 排除站点产物与纯文档，避免无意义的扫描
    paths-ignore:
      - "site/**"
      - "**.md"

permissions:
  contents: write      # 把历史数据写到独立的 radar-data 分支（main 不再有 bot commit）
  pages: write
  id-token: write
  actions: read        # 上传后轮询 artifact 元数据，规避 deploy-pages 的 API 一致性竞态

concurrency:
  group: git-radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # 零 npm 依赖：只用 Node 22 内置 fetch / fs

      # ── 存储模式 A（默认）：历史数据放独立 radar-data 分支 ──
      # main 分支不再产生任何 bot commit，本地不用反复 fetch/rebase，历史仍由 Git 永久留存。
      - name: 恢复历史数据（radar-data 分支）
        if: vars.RADAR_STORAGE != 'cache'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RADAR_REPO: ${{ github.repository }}
          RADAR_DATA_BRANCH: ${{ vars.RADAR_DATA_BRANCH }}
        run: node scripts/store.mjs pull

      # ── 存储模式 B（可选，设 Variables → RADAR_STORAGE=cache）──
      # 真·零 commit：用 Actions cache 全量快照，代价是缓存 7 天未访问会被回收。
      - name: 恢复历史数据（Actions cache）
        if: vars.RADAR_STORAGE == 'cache'
        uses: actions/cache/restore@v5
        with:
          path: site/data
          key: radar-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-state-

      - name: 扫描 GitHub 并生成日报
        env:
          RADAR_GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RADAR_PASSWORD: ${{ secrets.RADAR_PASSWORD }}
          # 可选：把免填重跑用的 fine-grained PAT 注入加密页；未配置时页面回退到手填模式
          # 仅在 RADAR_PASSWORD 存在时生效，明文站会拒绝注入
          RADAR_PAT: ${{ secrets.RADAR_PAT }}
          CF_AI_MODEL: ${{ vars.CF_AI_MODEL || '@cf/zai-org/glm-4.7-flash' }}
          # 分数线 / 名额 / 权重等全部读仓库根目录的 radar.config.json（设置页可改）
          RADAR_REPO: ${{ github.repository }}
        run: node scripts/run.mjs

      - name: 回写历史数据（仅 radar-data 分支）
        if: vars.RADAR_STORAGE != 'cache'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RADAR_REPO: ${{ github.repository }}
          RADAR_DATA_BRANCH: ${{ vars.RADAR_DATA_BRANCH }}
        run: node scripts/store.mjs push

      - name: 保存历史数据快照（Actions cache）
        if: vars.RADAR_STORAGE == 'cache'
        uses: actions/cache/save@v5
        with:
          path: site/data
          key: radar-state-${{ github.run_id }}-${{ github.run_attempt }}

      # data/*.json 是原始数据源，不必发布到 Pages；页面内容已内联在 HTML 里，
      # 移除后避免加密页面旁还留着明文数据。
      - name: 发布前移除原始数据
        run: rm -rf site/data

      # 安全闸门：静态产物里绝不允许出现明文 PAT。
      # 正常情况 PAT 只存在于 AES-GCM 密文里；若口令门被关闭或注入逻辑被改坏，
      # 这里会直接中止发布，而不是把凭证推到公开的 Pages 上。
      # 只统计命中文件数量、不打印命中内容，避免检查本身把 PAT 写进公开日志。
      - name: 发布前凭证泄漏检查
        run: |
          hits=$(grep -rlE "github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}" site --include="*.html" --include="*.js" --include="*.json" || true)
          if [ -n "$hits" ]; then
            count=$(printf '%s\n' "$hits" | wc -l)
            echo "::error::静态产物中发现明文 PAT（${count} 个文件），已中止发布。请确认 RADAR_PASSWORD 已配置、页面已加密；文件列表与命中内容不打印以免二次泄漏。"
            exit 1
          fi
          echo "静态产物无明文 PAT"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # deploy-pages 会在上传完成后立刻查 artifact 元数据；偶发情况下对象存储已写入、
      # 但 metadata API 还没一致，导致 "No artifacts named github-pages were found"（run #27）。
      # 这里先轮询到 artifact 可见再部署，把这类竞态挡在部署之前。
      - name: 等待 artifact 元数据可见
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          API_URL: ${{ github.api_url }}
        run: |
          for i in $(seq 1 20); do
            n=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$API_URL/repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
              | jq '[.artifacts[] | select(.name == "github-pages")] | length' 2>/dev/null || echo 0)
            if [ "$n" -ge 1 ]; then
              echo "artifact 元数据已可见（第 ${i} 次检查）"
              exit 0
            fi
            echo "artifact 尚未在 API 中可见，第 ${i}/20 次，5 秒后重试"
            sleep 5
          done
          echo "::warning::等待 100 秒后 artifact 仍不可见，尝试继续部署（若失败请重跑该 run）"

      - id: deploy
        uses: actions/deploy-pages@v5
