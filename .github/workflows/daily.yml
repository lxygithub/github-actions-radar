name: 每日 GitHub 副业雷达

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00。GitHub Actions 高峰期可能延迟几分钟
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write      # 把历史报告 commit 回仓库，永久留存
  pages: write
  id-token: write

concurrency:
  group: git-radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # 零 npm 依赖：只用 Node 22 内置 fetch / fs
      - name: 扫描 GitHub 并生成日报
        env:
          RADAR_GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RADAR_PASSWORD: ${{ secrets.RADAR_PASSWORD }}
          CF_AI_MODEL: ${{ vars.CF_AI_MODEL || '@cf/zai-org/glm-4.7-flash' }}
          MAX_PICKS: "8"
          MIN_SCORE: "60"
        run: node scripts/run.mjs

      - name: 归档历史报告到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "本次无新增报告"
          else
            git commit -m "chore: 副业雷达日报 $(date -u +%F)"
            git push
          fi

      # data/*.json 是仓库里的原始数据源（已 commit 留存），但不必发布到 Pages；
      # 页面内容已内联在 HTML 里，移除后避免加密页面旁还留着明文数据。
      - name: 发布前移除原始数据
        run: rm -rf site/data

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
