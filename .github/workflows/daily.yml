name: 每日 GitHub 副业雷达

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00。GitHub Actions 高峰期可能延迟几分钟
    - cron: "0 0 * * *"
  workflow_dispatch:
  # push 代码后自动跑完整流程并发布，不用再手动点 Run workflow
  push:
    branches: [main]
    # 排除站点产物与纯文档，避免无意义的扫描
    paths-ignore:
      - "site/**"
      - "**.md"

permissions:
  contents: write      # 把历史数据写到独立的 radar-data 分支（main 不再有 bot commit）
  pages: write
  id-token: write

concurrency:
  group: git-radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # 零 npm 依赖：只用 Node 22 内置 fetch / fs

      # ── 存储模式 A（默认）：历史数据放独立 radar-data 分支 ──
      # main 分支不再产生任何 bot commit，本地不用反复 fetch/rebase，历史仍由 Git 永久留存。
      - name: 恢复历史数据（radar-data 分支）
        if: vars.RADAR_STORAGE != 'cache'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RADAR_REPO: ${{ github.repository }}
          RADAR_DATA_BRANCH: ${{ vars.RADAR_DATA_BRANCH }}
        run: node scripts/store.mjs pull

      # ── 存储模式 B（可选，设 Variables → RADAR_STORAGE=cache）──
      # 真·零 commit：用 Actions cache 全量快照，代价是缓存 7 天未访问会被回收。
      - name: 恢复历史数据（Actions cache）
        if: vars.RADAR_STORAGE == 'cache'
        uses: actions/cache/restore@v5
        with:
          path: site/data
          key: radar-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-state-

      - name: 扫描 GitHub 并生成日报
        env:
          RADAR_GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RADAR_PASSWORD: ${{ secrets.RADAR_PASSWORD }}
          # 可选：把免填重跑用的 fine-grained PAT 注入加密页；未配置时页面回退到手填模式
          # 仅在 RADAR_PASSWORD 存在时生效，明文站会拒绝注入
          RADAR_PAT: ${{ secrets.RADAR_PAT }}
          CF_AI_MODEL: ${{ vars.CF_AI_MODEL || '@cf/zai-org/glm-4.7-flash' }}
          # 分数线 / 名额 / 权重等全部读仓库根目录的 radar.config.json（设置页可改）
          RADAR_REPO: ${{ github.repository }}
        run: node scripts/run.mjs

      - name: 回写历史数据（仅 radar-data 分支）
        if: vars.RADAR_STORAGE != 'cache'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RADAR_REPO: ${{ github.repository }}
          RADAR_DATA_BRANCH: ${{ vars.RADAR_DATA_BRANCH }}
        run: node scripts/store.mjs push

      - name: 保存历史数据快照（Actions cache）
        if: vars.RADAR_STORAGE == 'cache'
        uses: actions/cache/save@v5
        with:
          path: site/data
          key: radar-state-${{ github.run_id }}-${{ github.run_attempt }}

      # data/*.json 是原始数据源，不必发布到 Pages；页面内容已内联在 HTML 里，
      # 移除后避免加密页面旁还留着明文数据。
      - name: 发布前移除原始数据
        run: rm -rf site/data

      # 安全闸门：静态产物里绝不允许出现明文 PAT。
      # 正常情况 PAT 只存在于 AES-GCM 密文里；若口令门被关闭或注入逻辑被改坏，
      # 这里会直接中止发布，而不是把凭证推到公开的 Pages 上。
      # 只统计命中文件数量、不打印命中内容，避免检查本身把 PAT 写进公开日志。
      - name: 发布前凭证泄漏检查
        run: |
          hits=$(grep -rlE "github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}" site --include="*.html" --include="*.js" --include="*.json" || true)
          if [ -n "$hits" ]; then
            count=$(printf '%s\n' "$hits" | wc -l)
            echo "::error::静态产物中发现明文 PAT（${count} 个文件），已中止发布。请确认 RADAR_PASSWORD 已配置、页面已加密；文件列表与命中内容不打印以免二次泄漏。"
            exit 1
          fi
          echo "静态产物无明文 PAT"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
